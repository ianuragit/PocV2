<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Cop 2</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <canvas id="overlay"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-score"><span id="score">0</span><span id="combo"></span></div>
        <div class="hud-lives" id="lives"></div>
        <div class="hud-ammo" id="ammo"></div>
        <div class="hud-reload" id="reload">RELOAD</div>
        <div class="hud-banner" id="banner"></div>
      </div>
      <div id="flash"></div>
      <div id="popups"></div>
      <div id="screen" class="screen">
        <h1>REAL COP 2</h1>
        <p class="blink">Loading…</p>
      </div>
      <div id="version" class="version"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
