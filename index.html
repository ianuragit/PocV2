<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Cop 2</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <canvas id="overlay"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-score">
          <span class="label">SCORE</span><span id="score">0000000</span>
          <div id="combo"></div>
        </div>
        <div class="hud-lives" id="lives"></div>
        <div class="hud-weapon hidden" id="weapon"></div>
        <div class="hud-ammo" id="ammo"></div>
        <div class="hud-reload" id="reload">RELOAD</div>
        <div class="hud-banner" id="banner"></div>
      </div>
      <div id="flash"></div>
      <div id="popups"></div>
      <div id="screen" class="screen">
        <h1 class="logo">REAL COP 2</h1>
        <div class="loadbar"><div id="load-bar"></div></div>
        <p class="small">LOADING <span id="load-pct">0%</span></p>
      </div>
      <div id="version" class="version"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
